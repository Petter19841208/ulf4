<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uffes AI-assistent</title>

<style>
body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: #eef2f7;
    margin: 0;
    padding: 40px;
    text-align: center;
}

h1 {
    color: #003366;
    margin-bottom: 10px;
}

.subtitle {
    color: #666;
    margin-bottom: 30px;
    font-size: 18px;
}

video {
    width: 450px;
    max-width: 95%;
    border-radius: 16px;
    background: black;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

.question-box {
    max-width: 700px;
    margin: 30px auto;
}

textarea {
    width: 100%;
    min-height: 120px;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 18px;
    box-sizing: border-box;
}

button {
    margin-top: 15px;
    padding: 14px 30px;
    font-size: 18px;
    font-weight: bold;
    color: white;
    background: #0078d4;
    border: none;
    border-radius: 12px;
    cursor: pointer;
}

button:hover {
    background: #005a9e;
}
</style>
</head>

<body>

<h1>Uffes AI-assistent</h1>

<p class="subtitle">
Skriv din fråga och klicka på "Fråga Uffe".
</p>

<video id="avatarVideo" controls preload="auto">
    <source id="videoSource" src="uffe5.mp4" type="video/mp4">
    Din webbläsare stödjer inte video.
</video>

<div class="question-box">
    <textarea
        id="questionInput"
        placeholder="Skriv din fråga här...">
    </textarea>

    <br>

    <button onclick="spelaVideo()">
        Fråga Uffe
    </button>
</div>

<script>
function spelaVideo() {
    const video = document.getElementById("avatarVideo");
    const source = document.getElementById("videoSource");
    const fråga = document.getElementById("questionInput").value.trim().toLowerCase();

    if (fråga === "") {
        alert("Skriv gärna en fråga först.");
        return;
    }

    // Om frågan innehåller "gnaget är bäst"
    // spelas felmeddelandet istället
    if (fråga.includes("gnaget är bäst")) {
        source.src = "uffe5error.mp4";
        video.load();
    }

    // Alla andra frågor spelar vanliga Uffe-filmen
    else {
        source.src = "uffe5.mp4";
        video.load();
    }

    video.currentTime = 0;
    video.play();
}
</script>

</body>
</html>

Det enda som är nytt är egentligen detta:

if (fråga.includes("gnaget är bäst")) {
    source.src = "uffe5error.mp4";
    video.load();
}
